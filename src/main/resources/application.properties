spring.application.name=Productos
server.port=8081

# Conexion a MySQL (XAMPP por defecto). Se puede sobreescribir con variables de entorno.
spring.datasource.url=jdbc:mysql://localhost:3306/productos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate (el dialecto y el driver se detectan solos)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
